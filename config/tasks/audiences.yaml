# ============ 人人（Audiences）签到任务配置 ============
# 也可在图形界面任务「配置」中修改，保存后自动写回本文件
task:
  id: audiences
  name: "人人（Audiences）"
  enabled: true
  url: "https://site-e.example/index.php"

account:
  username: ""                  # 请填写 Audiences 用户名
  password: ""                  # 请填写 Audiences 密码
  two_step:
    enabled: false              # 该账号未开启两步验证（登录页 scode 字段留空即可）
    secret: ""
    vault_key: ""

options:
  has_2fa: false                # 没有 2FA；若以后开启，改成 true 并绑定验证器即可
  has_cf: true                  # 站点需要过 Cloudflare 人机验证
  use_proxy: false              # 是否走全局代理
  max_login_retry: 2            # 连续失败 20 次会封 IP，不要调大
  checkin_url: "https://site-e.example/index.php"
  turnstile_timeout: 40         # 签到页 Turnstile 人机验证的最长等待秒数
  schedule_time: "09:30"
  # ---- 桌面模式（默认开启）----
  # 流程：CookieCloud 取 cookie → 写入「正常浏览器」profile → 判定是否仍有效
  #       有效 → 打开正常浏览器（无调试端口，最大化 + 置顶）签到
  #       无效 → 用「开了调试端口的 Edge」自动登录（识别验证码/2FA），
  #              cookie 落盘到同一 profile，再打开正常浏览器签到
  # 两个浏览器共用一个独立 profile，cookie 才共享（不要和全局 browser.user_data_dir 混用）
  desktop_mode: true
  desktop_profile: "data/desktop_profile"   # 桌面模式专用 profile（调试/正常浏览器共用）
  desktop_debug_port: 9223                  # 调试浏览器端口（不要和全局 9222 冲突）
  desktop_window_title: "Audiences"         # 正常浏览器窗口标题关键字（用于最大化/置顶）
  desktop_startup_wait: 6                   # 正常浏览器打开后等页面渲染的秒数
  desktop_max_steps: 20                     # 识图点击最多执行多少步（每步一张截图）
  normal_maximized: true                    # 正常浏览器最大化
  normal_topmost: true                      # 正常浏览器置顶（始终显示在最前）
  keep_normal_open: false                   # 签到后是否保留正常浏览器窗口
