# ============ PT-空（pt_kong）签到任务配置 ============
# task.enabled          : 是否参与「运行全部启用」
# account.username      : 登录账号
# account.password      : 登录密码
# account.two_step.enabled : 本任务是否有 2FA（也可用 options.has_2fa 勾选）
# account.two_step.secret  : 直接填 base32 密钥（可选，填了优先用它）
# account.two_step.vault_key : 绑定 2FA 凭证库账号，格式 "issuer|name"
# options.has_2fa       : 本任务是否有二次验证（勾选）
# options.has_cf        : 本任务是否有 Cloudflare 人机验证（勾选；未勾选则不处理）
# options.use_proxy     : 本任务是否走全局代理（勾选才走，未勾选强制直连）
# options.max_login_retry : 登录失败重试次数
# options.schedule_time : 预留的每日签到时间
task:
  id: "pt_kong"
  name: "PT-空"
  enabled: true
  url: "https://site-a.example/index.php"
account:
  username: ""
  password: ""
  two_step:
    enabled: false
    secret: ""
    vault_key: ""
options:
  has_2fa: false
  has_cf: false
  use_proxy: false
  max_login_retry: 3
  schedule_time: "09:30"
