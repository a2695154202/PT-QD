# ============ 憨憨（HHCLUB）每日签到任务配置 ============
# NexusPHP 站点：登录页有图形验证码，两步验证字段是 two_step_code（有设置才填）
# 签到方式：登录成功后打开 attendance.php 并停留 5 秒即完成签到
task:
  id: hhan
  name: "憨憨（HHCLUB）"
  enabled: true
  url: "https://site-g.example/"

account:
  username: ""                  # 请填写憨憨用户名
  password: ""                  # 请填写憨憨密码
  two_step:
    enabled: true               # 账号开了两步验证就勾选（登录表单的 two_step_code）
    secret: ""                  # 直接填 base32 密钥（可选，填了优先用它）
    vault_key: ""               # 留空则按站点域名自动匹配凭证库

options:
  has_2fa: true                 # 账号设置了两步验证时勾选（没设置可改为 false）
  has_cf: false                 # 实测未遇到 Cloudflare 挑战；如遇到可改为 true
  use_proxy: false
  max_login_retry: 2            # 登录失败次数上限（跨天累计，只有登录成功才清零）
  checkin_url: "https://site-g.example/attendance.php"
  stay_seconds: 5               # 在签到页停留的秒数（打开即签到，停留够时间再判定）
  schedule_time: "09:30"
