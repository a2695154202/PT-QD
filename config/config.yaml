# ============ 全局配置（可在图形界面「全局设置」中修改）============
# browser.mode: launch=程序启动Edge并开放调试端口；attach=连接已运行的Edge
# browser.fullscreen / always_on_top: 启动后全屏 / 窗口置顶（仅 Windows 生效）
# ai: 任意 OpenAI 兼容接口；识别验证码需支持视觉的模型
# cookiecloud.mode: overwrite=拉取并覆盖到浏览器 / paused=暂停同步
# proxy: 全局代理；任务配置里勾选「走代理」的任务才使用它。
# telegram: 签到汇总推送到 Telegram；use_proxy=true 时复用上面的代理地址
#        没配置代理或本任务没勾选时一律直连，**从不使用 Windows 系统代理**
#        （开着系统代理/VPN 的电脑上，系统代理会让任务莫名超时）
# logging: 日志级别与全局日志文件
browser:
  mode: launch
  cdp_endpoint: http://127.0.0.1:9222
  debugging_port: 9222
  user_data_dir: data/edge_profile
  headless: false
  slow_mo: 50
  default_timeout: 20000        # 单步操作等待(ms)，慢机器可再调大
  nav_timeout: 45000            # 打开页面等待(ms)：CF 挑战页常迟迟不触发 domcontentloaded
  action_delay_ms: 150          # 每个动作前的拟人小延时(ms)，0=关闭；实际带随机抖动
  viewport_width: 1440
  viewport_height: 900
  stealth: true
  fullscreen: true
  always_on_top: true
ai:
  enabled: false
  base_url: https://api.openai.com/v1
  api_key: ''
  model: gpt-4o-mini
  vision_model: ''
  timeout: 60
  prompts:
    captcha: 这是一张网站登录/签到用的图形验证码图片，通常是4位字母数字。请只输出验证码内容本身，不要输出任何解释、标点或多余字符。
    popup_captcha: 这是一张签到弹窗中的图形验证码图片。请只输出验证码内容本身，不要输出任何解释、标点或多余字符。
cookiecloud:
  enabled: false
  mode: overwrite
  server: ''
  uuid: ''
  password: ''
  domains: []
proxy:
  enabled: false
  server: ''
  username: ''
  password: ''
telegram:
  enabled: false
  bot_token: ''
  chat_id: ''
  use_proxy: true          # 默认走代理（api.telegram.org 国内直连不通）
  only_on_failure: false   # 只在有任务失败时推送
logging:
  level: INFO
  file: data/logs/app.log
schedule:
  # 每日定时运行：到点自动跑一遍「启用」的任务（程序需保持打开）
  enabled: false
  time: '09:30'          # HH:MM，24 小时制
  skip_signed: true      # 跳过今天已签到的任务
  catch_up: true         # 错过时间点（程序后开）也补跑当天一次
  tasks: []              # 定时只跑这些任务（写 id，如 [akile, hhan]）；[] = 全部启用任务
